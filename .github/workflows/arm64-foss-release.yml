name: Arm64 FOSS Release APK (non-publishing)

on:
  workflow_dispatch:
  push:
    branches:
      - feature/oxygenos-gallery-nav-vault-performance
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/arm64-foss-release.yml"

permissions:
  contents: read

concurrency:
  group: arm64-foss-gallery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arm64-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Configure Release signing (repository secrets preferred)
        shell: bash
        env:
          RELEASE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          STORE="$RUNNER_TEMP/gallery-signing-keystore.p12"
          if [[ -n "$RELEASE_B64" && -n "$RELEASE_ALIAS" && -n "$RELEASE_KEY_PASSWORD" && -n "$RELEASE_STORE_PASSWORD" ]]; then
            printf '%s' "$RELEASE_B64" | base64 --decode > "$STORE"
            ALIAS="$RELEASE_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            echo "SIGNING_MODE=repository-release-key" >> "$GITHUB_ENV"
          else
            ALIAS="gallery-arm64-ci"
            KEY_PASSWORD="$(openssl rand -hex 20)"
            STORE_PASSWORD="$KEY_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 365 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Gallery Temporary CI Test Signature, O=Local Testing"
            echo "SIGNING_MODE=temporary-CI-not-upgrade-compatible" >> "$GITHUB_ENV"
          fi
          chmod 600 "$STORE"
          {
            echo "SIGNING_STORE_FILE=$STORE"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"


      - name: Run fast scroller unit tests
        run: ./gradlew :app:testFossReleaseUnitTest --tests org.fossify.gallery.helpers.FastScrollerBubbleTest --stacktrace

      - name: Assemble FOSS arm64-v8a Release ONLY
        run: ./gradlew :app:assembleFossRelease -PABI_SPLITS=true -PABI_TARGET=arm64-v8a --stacktrace

      - name: Validate APK, package name, signature and ABI
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/foss/release -maxdepth 1 -name '*.apk' -type f)
          if [[ "${#APKS[@]}" != 1 ]]; then
            echo "::error::Expected exactly one APK; found ${#APKS[@]}"
            exit 1
          fi
          APK="${APKS[0]}"
          if [[ "$APK" != *arm64-v8a-release.apk ]]; then
            echo "::error::Unexpected ABI output filename: $APK"
            exit 1
          fi
          TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -E "^package: name='org.fossify.gallery'"
          mapfile -t ABIS < <(unzip -Z -1 "$APK" | awk -F/ '/^lib\/[^/]+\// {print $2}' | sort -u)
          if (( ${#ABIS[@]} == 0 )); then
            echo "No native libraries packaged; ABI split is still strictly arm64-only."
          elif (( ${#ABIS[@]} != 1 )) || [[ "${ABIS[0]}" != "arm64-v8a" ]]; then
            echo "::error::APK includes unwanted ABI libraries: ${ABIS[*]}"
            exit 1
          else
            echo "Native libraries: arm64-v8a only"
          fi
          mkdir -p ci-apk
          cp "$APK" ci-apk/gallery-foss-arm64-v8a-release.apk
          echo "Verified source commit: $GITHUB_SHA"
          echo "APK SHA-256: $(sha256sum "$APK" | awk '{print $1}')"
          echo "Signing mode: $SIGNING_MODE"

      - name: Upload installable arm64 Release APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-foss-arm64-v8a-release
          path: ci-apk/gallery-foss-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Delete transient CI keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/gallery-signing-keystore.p12"
