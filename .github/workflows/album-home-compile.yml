name: Album home - feature compile

on:
  push:
    branches:
      - feature/album-home-sections
    paths:
      - "app/**"
      - "buildSrc/**"
      - "gradle/**"
      - ".github/workflows/album-home-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gallery-album-home-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile FOSS debug Kotlin
        run: ./gradlew :app:compileFossDebugKotlin --stacktrace
