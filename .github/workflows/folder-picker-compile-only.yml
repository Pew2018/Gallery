name: Gallery folder picker - tests and arm64 FOSS APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/oxygenos-folder-picker-polish
    paths:
      - "app/**"
      - "buildSrc/**"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/folder-picker-compile-only.yml"

permissions:
  contents: read

concurrency:
  group: gallery-picker-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-arm64-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      # Build a locally installable APK even if release-signing secrets are absent.
      - name: Configure signing for build artifact
        shell: bash
        env:
          RELEASE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          set +x
          STORE="$RUNNER_TEMP/gallery-picker-ci.p12"
          if [[ -n "$RELEASE_B64" && -n "$RELEASE_ALIAS" && -n "$RELEASE_KEY_PASSWORD" && -n "$RELEASE_STORE_PASSWORD" ]]; then
            printf '%s' "$RELEASE_B64" | base64 --decode > "$STORE"
            ALIAS="$RELEASE_ALIAS"
            KEY_PASSWORD="$RELEASE_KEY_PASSWORD"
            STORE_PASSWORD="$RELEASE_STORE_PASSWORD"
            echo "SIGNING_MODE=repository-release-key" >> "$GITHUB_ENV"
          else
            ALIAS="gallery-picker-temporary"
            KEY_PASSWORD="$(openssl rand -hex 20)"
            STORE_PASSWORD="$KEY_PASSWORD"
            keytool -genkeypair -noprompt -keystore "$STORE" -storetype PKCS12 \
              -alias "$ALIAS" -keyalg RSA -keysize 3072 -validity 365 \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Gallery Picker Compile Only, O=Local Testing"
            echo "SIGNING_MODE=temporary-CI-key-not-upgrade-compatible" >> "$GITHUB_ENV"
          fi
          chmod 600 "$STORE"
          {
            echo "SIGNING_STORE_FILE=$STORE"
            echo "SIGNING_KEY_ALIAS=$ALIAS"
            echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD"
            echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$KEY_PASSWORD"
          echo "::add-mask::$STORE_PASSWORD"

      - name: Run focused picker UI regression tests
        run: ./gradlew :app:testFossReleaseUnitTest --tests org.fossify.gallery.helpers.FolderPickerPolishTest --tests org.fossify.gallery.helpers.ClassicGalleryUiContractTest --stacktrace

      - name: Compile FOSS arm64-v8a release APK
        run: ./gradlew :app:assembleFossRelease -PABI_SPLITS=true -PABI_TARGET=arm64-v8a --stacktrace

      - name: Upload compiled APK
        uses: actions/upload-artifact@v4
        with:
          name: gallery-folder-picker-arm64-release
          path: app/build/outputs/apk/foss/release/*arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing file
        if: always()
        run: rm -f "$RUNNER_TEMP/gallery-picker-ci.p12"
