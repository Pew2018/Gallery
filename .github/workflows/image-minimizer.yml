name: Image Minimizer

on:
  issue_comment:
    types: [created, edited]
  issues:
    types: [opened, edited]
  pull_request_target:
    types: [opened, edited]

# This fork does not ship FossifyOrg APP_ID / APP_PRIVATE_KEY. Calling the
# reusable workflow fails in create-github-app-token before any image work.
# Keep a green no-op so PR checks are not blocked on missing org secrets.
jobs:
  soft-skip:
    runs-on: ubuntu-latest
    steps:
      - name: Soft-skip FossifyOrg image minimizer
        run: |
          echo "APP_ID / APP_PRIVATE_KEY are not configured on Pew2018/Gallery."
          echo "Skipping FossifyOrg image-minimizer and contribution-policy jobs."
