name: Gallery Android Emulator
on:
  workflow_dispatch:
    inputs:
      scale:
        type: choice
        options: [smoke, large, segment, ceiling]
        default: smoke
      api:
        type: choice
        options: ["30", "34", "36"]
        default: "34"
  push:
    branches: [fix/photo-viewer-five-item-boundary]
    paths: [".github/workflows/gallery-emulator-tests.yml", "app/build.gradle.kts", "app/src/androidTest/**", "tools/emulator-tests/**"]
permissions:
  contents: read
concurrency:
  group: gallery-emulator-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CI_MEDIA_SCALE: ${{ github.event.inputs.scale || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build emulator-compatible FOSS test variant
        run: ./gradlew :app:assembleFossDebug :app:assembleFossDebugAndroidTest -PEMULATOR_TEST_BUILD_TYPE=debug --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api || '34' }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          ram-size: 4096M
          disk-size: 4096M
          disable-animations: true
          script: bash tools/emulator-tests/run_on_device.sh
      - name: Preserve test reports and logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-emulator-${{ github.run_id }}
          path: |
            tools/emulator-tests/output/**
            app/build/outputs/androidTest-results/**
            app/build/reports/androidTests/**
          retention-days: 14
          if-no-files-found: warn
